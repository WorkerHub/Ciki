<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="ciki —— 把 Confluence 页面原样粘进来的团队 wiki。"
    />
    <title>Ciki</title>
    <script>
      // 首屏主题落定：必须在样式表与包体之前跑完，否则暗色用户会看到一帧白屏。
      // 值来自 zustand persist 写入的 ciki-theme（JSON），也兼容裸字符串。
      ;(() => {
        const root = document.documentElement
        const meta = document.querySelector('meta[name="theme-color"]')
        let theme = "auto"
        try {
          const stored = localStorage.getItem("ciki-theme")
          if (stored) {
            try {
              theme = JSON.parse(stored)?.state?.theme ?? stored
            } catch {
              theme = stored
            }
          }
        } catch {
          // localStorage 被禁用时按浅色走，不阻塞渲染
        }
        if (theme !== "light" && theme !== "dark") theme = "auto"
        const dark =
          theme === "dark" ||
          (theme === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        root.classList.toggle("dark", dark)
        // Kumo 的明暗由 [data-mode] + color-scheme 驱动，shadcn 令牌用 .dark 类。
        root.setAttribute("data-mode", dark ? "dark" : "light")
        root.style.colorScheme = dark ? "dark" : "light"
        if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#ffffff")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
