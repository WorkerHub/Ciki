<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta
      name="description"
      content="Ciki —— 为个人与小团队打造的 wiki：空间、树形页面、版本历史、全文检索；部署在 Cloudflare 上，免服务器、免运维。"
    />
    <title>Ciki</title>
    <script>
      // 首屏主题落定：必须在样式表与包体之前跑完，否则暗色用户会看到一帧白屏。
      // 值来自 zustand persist 写入的 ciki-theme（JSON），也兼容裸字符串。
      // 颜色真源挂在 window.__THEME_META_COLORS__，与 web/src/lib/theme.ts 对齐。
      window.__THEME_META_COLORS__ = {
        nova: { light: "#ffffff", dark: "#0a0a0a" },
        paper: { light: "#f7f4ee", dark: "#0b0c0e" },
        natural: { light: "#faf6f1", dark: "#191612" },
        eink: { light: "#f5f3ea", dark: "#171814" },
        notion: { light: "#ffffff", dark: "#191919" },
        sketch: { light: "#f5f0e8", dark: "#262420" },
        distill: { light: "#ffffff", dark: "#11161b" }
      }
      ;(() => {
        const root = document.documentElement
        const meta = document.querySelector('meta[name="theme-color"]')
        let mode = "auto"
        let style = "nova"
        try {
          const stored = localStorage.getItem("ciki-theme")
          if (stored) {
            try {
              const parsed = JSON.parse(stored)
              mode = parsed?.state?.mode ?? parsed?.state?.theme ?? parsed
              style = parsed?.state?.style ?? "nova"
            } catch {
              mode = stored
            }
          }
        } catch {
          // localStorage 被禁用时按浅色走，不阻塞渲染
        }
        if (mode !== "light" && mode !== "dark") mode = "auto"
        const validStyles = [
          "nova",
          "paper",
          "natural",
          "eink",
          "notion",
          "sketch",
          "distill"
        ]
        if (!validStyles.includes(style)) style = "nova"
        const dark =
          mode === "dark" ||
          (mode === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        root.setAttribute("data-theme", style)
        root.classList.toggle("dark", dark)
        // Kumo 的明暗由 [data-mode] + color-scheme 驱动，shadcn 令牌用 .dark 类。
        root.setAttribute("data-mode", dark ? "dark" : "light")
        root.style.colorScheme = dark ? "dark" : "light"
        if (meta) {
          const themeColors =
            window.__THEME_META_COLORS__[style] ||
            window.__THEME_META_COLORS__.nova
          meta.setAttribute("content", dark ? themeColors.dark : themeColors.light)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
